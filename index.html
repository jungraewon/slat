<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA 스마트폰 구매 실험</title>

  <link rel="stylesheet" href="./src/style.css">
</head>

<body>

  <section id="startScreen" class="screen">

    <div class="start-card">

      <div class="logo">NOVA</div>

      <h1>스마트폰 구매 실험</h1>

      <p class="start-description">
        여러 스마트폰을 비교한 후<br>
        가장 구매하고 싶은 상품을 선택해주세요.
      </p>

      <div class="notice-box">

        <p>✓ 모든 상품은 가상의 상품입니다.</p>

        <p>✓ 원하는 만큼 상품을 비교할 수 있습니다.</p>

      </div>

      <button
        id="startButton"
        class="button button-primary"
      >
        쇼핑 시작하기
      </button>

    </div>

  </section>


  <section
    id="shopScreen"
    class="screen hidden"
  >

    <header class="header">

      <div class="header-inner">

        <div class="header-logo">
          NOVA
        </div>

        <div class="header-title">
          스마트폰
        </div>

        <div class="header-badge">
          구매 실험
        </div>

      </div>

    </header>


    <main class="shop-container">

      <div class="page-heading">

        <h2>스마트폰</h2>

        <p>
          원하는 상품을 자유롭게 비교해보세요.
        </p>

      </div>

      <div
        id="productGrid"
        class="product-grid"
      ></div>

    </main>

  </section>


  <section
    id="detailScreen"
    class="screen hidden"
  >

    <header class="header">

      <div class="header-inner">

        <button
          id="backButton"
          class="back-button"
        >
          ← 상품 목록
        </button>

        <div class="header-logo">
          NOVA
        </div>

        <div></div>

      </div>

    </header>


    <main
      id="detailContainer"
      class="detail-container"
    ></main>

  </section>


  <div
    id="confirmModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <button
        id="closeModal"
        class="modal-close"
      >
        ×
      </button>

      <div class="modal-icon">
        🛒
      </div>

      <h3 id="confirmTitle">
        이 상품을 선택하시겠습니까?
      </h3>

      <p>
        최종 선택 후에는 실험이 종료됩니다.
      </p>

      <div class="modal-buttons">

        <button
          id="cancelButton"
          class="button button-secondary"
        >
          취소
        </button>

        <button
          id="confirmButton"
          class="button button-primary"
        >
          선택하기
        </button>

      </div>

    </div>

  </div>


  <section
    id="completeScreen"
    class="screen hidden"
  >

    <div class="complete-card">

      <div class="complete-icon">
        ✓
      </div>

      <h1>
        선택이 완료되었습니다.
      </h1>

      <p>
        실험에 참여해주셔서 감사합니다.
      </p>

      <div class="complete-box">
        최종 선택이 정상적으로 기록되었습니다.
      </div>

    </div>

  </section>


  <script
    type="module"
    src="./src/main.js"
  ></script>

</body>
</html>
